    <!-- Preloader critical CSS — inline so the lock is available at first paint,
       before the external stylesheet finishes loading. Mirrors generator/index.html
       <style id="ts-preloader-boot"> pattern. -->
    <style id="ts-preloader-boot">
      /* FOUC guard: body background locks to the dark default before external CSS parses.
         Prevents white flash on cold loads. The external stylesheet overrides this once loaded. */
      html.ts-preloader-lock body {
        background-color: #0c0d0f !important;
      }

      html.ts-preloader-lock,
      html.ts-preloader-lock body {
        overflow: hidden !important;
      }

      html.ts-preloader-lock #ts-app,
      html.ts-preloader-lock #ts-main {
        visibility: hidden !important;
        pointer-events: none !important;
      }

      /* Ensure preloader overlay paints before external CSS resolves.
         Fallback background mirrors --ts-bg-body dark default. */
      html.ts-preloader-lock .ts-preloader {
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        background-color: #0c0d0f !important;
      }

       /* Hide sidebar during preloader (it's outside #ts-main) */
    html.ts-preloader-lock .ts-oce-panel.ts-oce--open,
    html.ts-preloader-lock #ts-debug-root,
    html.ts-preloader-lock .ts-oce-panel.ts-oce--open .ts-oce-fab {
      opacity: 0 !important;
      z-index: -20 !important;

      pointer-events: none !important;
    }
    </style>

    <!-- Toolskin System (local — render-critical) -->
    <script>
      document.documentElement.classList.add('ts-preloader-lock');
      window.__TOOLSKIN_CONFIG__ = {
        cursor: { mode: 'simple', follower: true, easing: 0.42, followerEasing: 0.12 },
        reveal: { enabled: false, useGSAP: false, stagger: 0.05, rootMargin: '0px 0px -40px 0px' },
        smoothScroll: { enabled: false, duration: 1.2 },
      };
      // Font-gate: reveal preloader text only after the two fonts it uses are loaded.
      // Uses document.fonts.load() for specific families (resolves fast, doesn't wait for FA).
      Promise.all([
        document.fonts.load('600 1em "Space Grotesk"'),
        document.fonts.load('400 1em "JetBrains Mono"')
      ]).then(function () {
        document.documentElement.classList.add('ts-fonts-ready');
      });
    </script>

    /* ════════════════════════════════════════════════════════════════════
   * TS CUBE PORTFOLIO  —  EXTRACTED HEADER STYLES  (PENDING INTEGRATION)
   * ════════════════════════════════════════════════════════════════════
   *
   * STATUS
   * ──────────────────────────────────────────────────────────────────
   * These styles are extracted from the cube-portfolio source. They
   * are pending: filtering, tokenization, updating, and seamless
   * adaptation INTO the core CSS — preserving the current visual
   * snapshot while avoiding the creation of new classes and reusing
   * the existing Toolskin base.
   *
   * Keep ONLY what does not already exist in core for displaying or
   * rendering. Diff the unique properties during the refactor and
   * fold them into existing components / variants.
   *
   * Alternatively, this file may stay isolated UNTIL integration is
   * complete — but the final cube-portfolio component MUST NOT ship
   * with its own dedicated CSS sheet.
   *
   * ────────────────────────────────────────────────────────────────────
   * GLOBAL POLICY  (read before editing)
   * ────────────────────────────────────────────────────────────────────
   * - Keep ONLY elements that are irreplaceable and do not match any
   *   existing pattern in the core.
   * - The rest can be assembled in the HTML using existing core
   *   classes / variants.
   * - Creating new classes for things that share properties with
   *   existing components conflicts with general product deployment.
   * - Rely ONLY on the core CSS, the asset-based system, and its
   *   filebase. Do NOT generate new elements for things that share
   *   properties with what already exists.
   * - Same applies to tokens: replace ad-hoc values with the current
   *   production tokens wherever possible.
   *
   * ────────────────────────────────────────────────────────────────────
   * PER-ELEMENT INTEGRATION PLAN
   * ────────────────────────────────────────────────────────────────────
   *
   *  1. RULERS
   *     The ruler elements are mostly built in JS — VERY FEW CSS
   *     elements are needed. Those few must persist.
   *     → Use surface tokens, NOT hardcoded colors, so that
   *       light-theme switching remains valid.
   *
   *  2. BACKGROUND BIG-LETTER DESIGN
   *     Add as another variant on the core design base.
   *     → Needs integration, tokenization, and adaptability.
   *
   *  3. SWIPE / WIPE NAVIGATION
   *     Integration is already noted in the isolated JS file (which
   *     also needs splitting).
   *     → The styling and handling must be economized and minimized,
   *       while keeping the same rendering / display capability.
   *
   *  4. SIDEBAR  ⚠ NAMING CONFLICT
   *     The class `ts-portfolio-sidebar` already exists in core. It must be
   *     REPLACED, not re-scoped — across JS, HTML, and CSS.
   *     Do NOT keep it: it will break everything.
   *
   *  5. MOVING / SLIDING MENU ITEMS
   *     Should not be a problem to refactor using existing Toolskin
   *     tokens, classes, and styles. NO new classes should be
   *     created for this — variants only, if needed.
   *     The actual COMPONENT is the sliding sidebar. Only the items
   *     and their interactions will carry rules. Optimize as much as
   *     possible and avoid creating new classes where elements
   *     visually share properties. Same for tokens — replace with
   *     current production tokens where possible.
   *     This scope is for display purposes only.
   *
   *  6. LOADER
   *     Must be unified with the system's `ts-preloader`:
   *       - Share styles, DOM, and CSS via aliases / class pending.
   *       - Add the remaining DOM elements needed to match.
   *     The JS must remain as it is — it is fit for loading the
   *     currently deployed assets.
   *
   *  7. 3D INTERACTIVE CUBE  (still experimental)
   *     Works and is usable, but it must become dynamic: able to
   *     load elements from a gallery source (posts, a folder, or a
   *     JSON feed) and to bind menu entries to cube tiles
   *     dynamically through hooks, while remaining a separate asset.
   *
   *  8. COMPONENT PAIRING  (ts-cube-gallery + ts-slide-menu)
   *     - `ts-cube-gallery` is an integratable component on its own.
   *     - `ts-slide-menu` (pending rename) is a standalone asset
   *       with hooks for the cube and any other navigation /
   *       gallery system. Both need integration.
   *
   * ════════════════════════════════════════════════════════════════════ */


    /* ── THEME TOKENS  (locals only — DO NOT promote, see policy above) ── */
    :root {

    /* ── LOADER ──
     * INTEGRATION: must be unified with system `ts-preloader`. See
     * point 6 of the per-element plan above. */
    #ts-loader {
      position: fixed;
      inset: 0;
      z-index: 8000;
      background: var(--ts-bg-body);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition: opacity .65s, visibility .65s;
    }

    #ts-loader.out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #ts-loader-track {
      width: 180px;
      height: 1px;
      background: rgba(255, 255, 255, .07);
      position: relative;
      overflow: hidden;
    }

    #ts-loader-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: var(--ts-accent);
      width: 0%;
      transition: none;
    }

    #ts-loader-num {
      font-family: var(--ts-font-mono);
      font-size: 10px;
      letter-spacing: .2em;
      color: rgba(255, 255, 255, .3);
    }

    /* ── RULERS ──
     * Legacy DOM-based ruler. Superseded by the SVG ruler below
     * (`.ts-grid-rules*`). Few CSS elements only — these MUST persist
     * during integration. Replace `rgba(255,255,255,.05)` borders with
     * surface tokens to keep light-theme switching valid. */
    #ts-rt {
      position: fixed;
      top: 0;
      left: var(--rsz);
      right: 0;
      height: var(--rsz);
      z-index: 500;
      pointer-events: none;
      border-bottom: 1px solid var(--ts-ruler-border);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .ts-rt-ruler {
      flex: 1;
      height: 4px;
      border-left: 1px solid var(--ts-ruler-border);
      position: relative;
    }

    .ts-rt-ruler.m {
      height: 9px;
    }

    .ts-rt-ruler.m::before {
      content: attr(data-v);
      position: absolute;
      bottom: 11px;
      left: 2px;
      font-size: 7px;
      font-family: var(--ts-font-mono);
      color: rgba(255, 255, 255, .2);
      white-space: nowrap;
    }

    #ts-rl {

      top: var(--rsz);

      bottom: 0;

      z-index: 500;
      pointer-events: none;
      border-right: 1px solid var(--ts-ruler-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ts-rl-ruler {
      flex: 1;
      border-top: 1px solid var(--ts-ruler-border);
    }

    /* ── TOPBAR ──

    .ts-topbar-slide {

      top: var(--rsz);

      right: 0;
      height: var(--nh);

      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--ts-ruler-border);
      background: color-mix(in srgb, var(--ts-bg-body) 88%, transparent);

    }

    .ts-dims {
      font-family: var(--ts-font-mono);
      font-size: 10px;

    }

    .ts-nav-slide {
      display: flex;
      list-style: none;

    }

    .ts-nav-slide a {

    /* ── SIDEBAR ──  ⚠ NAMING CONFLICT
     * `#ts-portfolio-sidebar` collides with an existing core component named the
     * same way. Must be REPLACED (not re-scoped) across JS, HTML, and

     * everything. See point 4 of the per-element plan above. */
    #ts-portfolio-sidebar {
        width: var(--sw);
        flex-shrink: 0;
        border-left: 1px solid var(--ts-this-bg-border);
        position: relative;
        overflow: hidden;
        grid-area: sidebar;
        /* backdrop-filter: blur(3px); */
        --scroll-fade-size: 25dvh;
        --scroll-fade-color-visible: black;
        --scroll-fade-color-hidden: transparent;
        --scroll-mask: linear-gradient(
        to bottom,
        var(--scroll-fade-color-hidden) 0px,
        var(--scroll-fade-color-visible) var(--scroll-fade-size),
        var(--scroll-fade-color-visible) calc(100% - var(--scroll-fade-size)),
        var(--scroll-fade-color-hidden) 100%
      );
        -webkit-mask-image: var(--scroll-mask);
        mask-image: var(--scroll-mask);
        /* background: var(--ts-this-bg); */
    }
    #ts-mt {
      position: absolute;
      top: 0;
      left: 0;

    /* Sliding menu items (.ts-slide-menu-item)
     * INTEGRATION: refactor onto existing Toolskin tokens / classes.
     * No new classes should be created — variants only, if needed.
     * The COMPONENT is the sliding sidebar; only items and their
     * interactions carry rules here. See point 5 of the plan above. */
     .ts-slide-menu-item {
      display: block;
      padding: 13px 20px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .01em;
      color: var(--ts-text-primary-dim-2);
      border-bottom: 1px solid var(--ts-this-bg-border);
      text-decoration: none;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(12px) skewY(1.5deg);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), color .22s,transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), padding-left .3s cubic-bezier(.16, 1, .3, 1)!important;
      background: color-mix(in srgb, var(--ts-bg-body) 88%, transparent);
      background: var(--ts-this-bg-dim-4);
      --ts-this-bg: var(--ts-bg-body);
    }
    .ts-slide-menu-item.revealed {
      opacity: 1;
      transform: translateY(0) skewY(0);
    }

    .ts-slide-menu-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      max-width: 0px;
      background: var(--ts-accent-dim-5);
      transition: max-width .53s ease, border 300ms ease;
      border-left: 0px solid transparent;
      pointer-events: none;
    }
    /* Only ONE item is active — the directly hovered one */
    .ts-slide-menu-item.is-active {
      color: var(--ts-accent) !important;
      padding-left: 30px !important;
      font-weight: 500;
    }

    .ts-slide-menu-item.is-active::before, .ts-slide-menu-item:hover::before {
      max-width: 100%;
      border-left: 3px solid var(--ts-accent);
    }

    .ts-slide-menu-item.is-dimmed {
      color: var(--ts-text-muted-dim)!important;
    }
    .ts-slide-menu-item.is-dimmed::before {
      width: 0;
    }

  { id: 'ts_5', slug: 'shaped-by-earth', title: 'Shaped by Earth', type: 'Brand · Experience', year: '2025', client: 'Shaped by Earth', desc: 'Digital identity and immersive brand experience for a sustainable luxury materials brand.', main: 'https://picsum.photos/300?random=18', imgs: ['https://picsum.photos/600/450?random=19','https://picsum.photos/600/450?random=20','https://picsum.photos/600/450?random=21','https://picsum.photos/600/450?random=22','https://picsum.photos/600/450?random=23'] },

  { id: 'ts_15', slug: 'neon-garden', title: 'Neon Garden', type: 'Experiential', year: '2026', client: 'Flux Events', desc: 'Immersive LED garden installation for festival environment spanning 2000m² of programmable light.', main: 'https://picsum.photos/300?random=61', imgs: ['https://picsum.photos/600/450?random=62','https://picsum.photos/600/450?random=63','https://picsum.photos/600/450?random=64','https://picsum.photos/600/450?random=65'] },

];

// ── BUILD PROJECT LIST ──────────────────────────────────────────
function buildProjects(target) {
  const list = [];
  let i = 0;
  while (list.length < target) {
    const base = BASE_PROJECTS[i % BASE_PROJECTS.length];
    list.push({ ...base, id: base.id + '_' + list.length });
    i++;
  }
  return list;
}

const PROJECTS = buildProjects(CONFIG.targetTiles);
const N = PROJECTS.length;
const MENU_LIST = [...PROJECTS, ...PROJECTS, ...PROJECTS, ...PROJECTS];
const ITEM_H = 43;

// ── HELPER: face index ──────────────────────────────────────────
function getFaceIdx(index, total) {
  const perFace = Math.ceil(total / 6);
  return Math.floor(index / perFace);
}

// ── SHADERS ──────────────────────────────────────────────────────
const VS = `
  varying float vFacing;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vec3 wn = normalize(normalMatrix * normal);
    vec3 vd = normalize(-(modelViewMatrix * vec4(position,1.0)).xyz);
    vFacing = dot(wn, vd);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
  }`;

const FS = `
  precision highp float;
  uniform sampler2D tMap;
  uniform float uAlpha;
  uniform float uIsActive;
  uniform float uBorder;
  varying vec2 vUv;
  varying float vFacing;
  void main() {
    vec4 color = texture2D(tMap, vUv);
    color.a = uAlpha;
    float isBack = step(vFacing, 0.0);
    float darken = mix(1.0, 0.22, isBack);
    darken = mix(darken, 1.0, uIsActive);
    color.rgb *= darken;
    color.rgb *= mix(1.0, 1.2, uIsActive);
    vec2 border = step(uBorder, vUv) * step(uBorder, 1.0 - vUv);
    float isBorder = 1.0 - border.x * border.y;
    color.rgb = mix(color.rgb, vec3(0.0), isBorder * 0.3);
    gl_FragColor = color;
  }`;

// ── PLACEMENT FUNCTION ──────────────────────────────────────────
function placeTile(media, index, length, size) {
  const perFace = Math.ceil(length / 6);
  const faceIdx = Math.floor(index / perFace);
  const local = index % perFace;
  const cols = Math.ceil(Math.sqrt(perFace));
  const col = local % cols;
  const row = Math.floor(local / cols);
  const fd = size * 1.9;
  const sp = size * CONFIG.gap;
  const ctr = (cols - 1) / 2;

  const faces = [
    { x: fd, y: (row - ctr) * sp, z: (col - ctr) * sp, rx: 0, ry: Math.PI/2, rz: 0 },
    { x: -fd, y: (row - ctr) * sp, z: -(col - ctr) * sp, rx: 0, ry: -Math.PI/2, rz: 0 },
    { x: (col - ctr) * sp, y: fd, z: (row - ctr) * sp, rx: -Math.PI/2, ry: 0, rz: 0 },
    { x: (col - ctr) * sp, y: -fd, z: -(row - ctr) * sp, rx: Math.PI/2, ry: 0, rz: 0 },
    { x: (col - ctr) * sp, y: (row - ctr) * sp, z: fd, rx: 0, ry: 0, rz: 0 },
    { x: -(col - ctr) * sp, y: (row - ctr) * sp, z: -fd, rx: 0, ry: Math.PI, rz: 0 },
  ];
  const f = faces[faceIdx] || faces[0];
  media.mesh.position.set(f.x, f.y, f.z);
  media.mesh.rotation.set(f.rx, f.ry, f.rz);
  media.faceIdx = faceIdx;
}

// ── WEBGL RENDERER ──────────────────────────────────────────────
(function() {
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const ph = document.getElementById('ts-canvas-cube');
  ph.replaceWith(renderer.domElement);
  Object.assign(renderer.domElement.style, {
    position: 'absolute', inset: '0',
    width: '100%', height: '100%', zIndex: '999', display: 'block'
  });
  renderer.domElement.id = 'ts-canvas-cube';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 4;
  const clock = new THREE.Clock();
  const geo = new THREE.PlaneGeometry(CONFIG.tileSize, CONFIG.tileSize);

  class TileMedia {
    constructor(index, length, texture) {
      this.index = index;
      this.length = length;
      this.texture = texture;
      this.faceIdx = 0;
      this._mkMat();
      this._mkMesh();
    }
    _mkMat() {
      this.mat = new THREE.ShaderMaterial({
        vertexShader: VS,
        fragmentShader: FS,
        uniforms: {
          tMap: { value: this.texture },
          uAlpha: { value: 0 },
          uIsActive: { value: 0 },
          uBorder: { value: CONFIG.border },
          uTime: { value: 0 },
        },
        transparent: true,
        side: THREE.DoubleSide,
      });
    }
    _mkMesh() {
      this.mesh = new THREE.Mesh(geo, this.mat);
      this.mesh.scale.set(1,1,1);
    }
    show({ delay = 0 } = {}) {
      gsap.timeline({ delay, defaults: { ease: 'expo.inOut', duration: 1.5 } })
        .fromTo(this.mat.uniforms.uAlpha, { value: 0 }, { value: 1 }, 0);
    }
    setAlpha(v) {
      gsap.killTweensOf(this.mat.uniforms.uAlpha);
      gsap.to(this.mat.uniforms.uAlpha, { value: v, duration: .8, ease: 'power2.out' });
    }
    setActive(v) {
      gsap.killTweensOf(this.mat.uniforms.uIsActive);
      gsap.to(this.mat.uniforms.uIsActive, { value: v ? 1 : 0, duration: .8, ease: 'power2.out' });
    }
    update() { this.mat.uniforms.uTime.value += 0.016; }
    destroy() {
      gsap.killTweensOf(this.mat.uniforms.uAlpha);
      gsap.killTweensOf(this.mat.uniforms.uIsActive);
      this.mat.dispose();
    }
  }

  class IndexGallery {
    constructor() {
      this.parentGroup = new THREE.Group();
      this.group = new THREE.Group();
      this.parentGroup.add(this.group);
      this.rotX = 0.02;
      this.rotY = 0.06;
      this.rotZ = 0.01;
      this.tScale = 1.0;
      this.targetTScale = 1.0;
      this.lastT = 0;
      this.gScale = 0.45;
      this.medias = [];
      this.transitionToHide = false;
      this.rotationTween = null;
      scene.add(this.parentGroup);
      // Raycaster for tile clicks
      this.raycaster = new THREE.Raycaster();
      this.mouse = new THREE.Vector2();
      // Click handler
      renderer.domElement.addEventListener('click', this.onTileClick.bind(this));
    }

    build(texMap) {
      PROJECTS.forEach((proj, i) => {
        const textures = texMap.get(proj.id);
        if (!textures || textures.length === 0) return;
        const texIndex = i % textures.length;
        const tex = textures[texIndex];
        if (!tex) return;
        const m = new TileMedia(i, N, tex);
        m.slug = proj.slug;
        const sz = Math.max(m.mesh.scale.x, m.mesh.scale.y);
        placeTile(m, i, N, sz);
        this.group.add(m.mesh);
        this.medias.push(m);
        m.show({ delay: 0.25 + i * 0.04 });
      });
      this.group.rotation.x = 0;
      this.group.rotation.y = 0;
      const tl = gsap.timeline({ defaults: { ease: 'expo.inOut', duration: 2.5 } });
      tl.fromTo(this.parentGroup.scale,
        { x: 0, y: 0, z: 0 },
        { x: this.gScale, y: this.gScale, z: this.gScale }, 0
      ).fromTo(this.parentGroup.rotation,
        { x: -Math.PI * 0.2, y: -Math.PI * 1.85 },
        { x: 0, y: 0 }, 0
      ).timeScale(0.85);
    }

    rotateToFace(faceIdx) {
      const targets = [
        { x: 0, y: -Math.PI/2, z: 0 },
        { x: 0, y:  Math.PI/2, z: 0 },
        { x: -Math.PI/2, y: 0, z: 0 },
        { x:  Math.PI/2, y: 0, z: 0 },
        { x: 0, y: 0, z: 0 },
        { x: 0, y: Math.PI, z: 0 }
      ];
      const target = targets[faceIdx] || targets[4];
      if (this.rotationTween) this.rotationTween.kill();
      this.rotationTween = gsap.to(this.group.rotation, {
        x: target.x,
        y: target.y,
        z: target.z,
        duration: CONFIG.rotationDuration,
        ease: 'power3.inOut',
        onComplete: () => { this.rotationTween = null; }
      });
      this.targetTScale = 0.25;
      gsap.to(this, { tScale: this.targetTScale, duration: 0.8, ease: 'power2.out' });
    }

    resetRotation() {
      if (this.rotationTween) {
        this.rotationTween.kill();
        this.rotationTween = null;
      }
      this.targetTScale = 1.0;
      gsap.to(this, { tScale: this.targetTScale, duration: 1.2, ease: 'power2.out' });
    }

    onMouseEnter(slug) {
      if (this.transitionToHide) return;
      const tile = this.medias.find(m => m.slug === slug);
      if (tile) this.rotateToFace(tile.faceIdx);
      this.medias.forEach(m => {
        const hit = m.slug === slug;
        m.setAlpha(hit ? 1 : 0.1);
        m.setActive(hit);
      });
      gsap.to(this.parentGroup.scale, { x: .55, y: .55, z: .55, duration: 1, ease: 'expo.out' });
    }

    onMouseLeave() {
      if (this.transitionToHide) return;
      this.resetRotation();
      this.medias.forEach(m => { m.setAlpha(1); m.setActive(false); });
      gsap.to(this.parentGroup.scale, { x: this.gScale, y: this.gScale, z: this.gScale, duration: 1, ease: 'expo.out' });
    }

    // ── TILE CLICK HANDLER ──────────────────────────────────────
    onTileClick(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      this.raycaster.setFromCamera(this.mouse, camera);
      const meshes = this.medias.map(m => m.mesh);
      const intersects = this.raycaster.intersectObjects(meshes);
      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const media = this.medias.find(m => m.mesh === hitMesh);
        if (media && media.slug) {
          const project = PROJECTS.find(p => p.slug === media.slug);
          if (project) {
            openDetail(project);
          }
        }
      }
    }

    update(elapsed) {
      const d = elapsed - this.lastT;
      this.lastT = elapsed;
      if (d > 0.2) return;
      const speed = this.tScale;
      this.group.rotation.x += d * this.rotX * speed;
      this.group.rotation.y += d * this.rotY * speed;
      this.group.rotation.z += d * this.rotZ * speed;
      this.medias.forEach(m => m.update());
    }

    destroy() {
      this.medias.forEach(m => { this.group.remove(m.mesh); m.destroy(); });
      scene.remove(this.parentGroup);
      renderer.domElement.removeEventListener('click', this.onTileClick);
    }
  }

  // Resize
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  // RAF
  let gallery = null;
  (function raf() {
    requestAnimationFrame(raf);
    if (gallery) gallery.update(clock.getElapsedTime());
    renderer.render(scene, camera);
  })();

  // Expose API
  window._TSGallery = {
    preload(onProg, onDone) {
      const mgr = new THREE.LoadingManager();
      const ldr = new THREE.TextureLoader(mgr);
      const texMap = new Map();
      let totalImages = 0;
      PROJECTS.forEach(p => {
        const count = 1 + Math.min(2, (p.imgs || []).length);
        totalImages += count;
      });
      mgr.onProgress = (_, l, t) => onProg(l / t);
      mgr.onLoad = () => onDone(texMap);
      PROJECTS.forEach(p => {
        const urls = [p.main];
        const extras = (p.imgs || []).slice(0, 2);
        urls.push(...extras);
        const textures = [];
        urls.forEach(url => {
          ldr.load(url, tex => {
            tex.needsUpdate = true;
            tex.colorSpace = THREE.SRGBColorSpace;
            textures.push(tex);
            if (textures.length === urls.length) {
              texMap.set(p.id, textures);
            }
          }, undefined, () => {
            textures.push(null);
            if (textures.length === urls.length) {
              texMap.set(p.id, textures.filter(t => t !== null));
            }
          });
        });
      });
    },
    init(texMap) {
      gallery = new IndexGallery();
      gallery.build(texMap);
    },
    enter(slug) { gallery?.onMouseEnter(slug); },
    leave() { gallery?.onMouseLeave(); },
  };
})();

// ── SIDEBAR MENU ──────────────────────────────────────────────────
const mt = document.getElementById('ts-mt');
const sb = document.getElementById('ts-portfolio-sidebar');
mt.style.height = (MENU_LIST.length * ITEM_H) + 'px';

MENU_LIST.forEach((proj, idx) => {
  const a = document.createElement('a');
  a.className = 'ts-slide-menu-item';
  a.href = '#';
  a.textContent = proj.title;
  a.dataset.slug = proj.slug;
  a.dataset.idx = idx;
  mt.appendChild(a);
});

const links = Array.from(mt.querySelectorAll('.ts-slide-menu-item'));

// ── Reveal animation ─────────────────────────────────────────────
function revealMenu() {
  links.forEach((el, i) => {
    const delay = i * 30 + (i % 10) * 20;
    el.style.transitionDelay = delay + 'ms';
    el.style.opacity = '0';
    el.style.transform = 'translateX(-40px)';
    setTimeout(() => {
      el.classList.add('revealed');
      el.style.opacity = '1';
      el.style.transform = 'translateX(0)';
    }, delay + 100);
  });
}

// ── SCROLL: snap to nearest item after wheel stops ──────────────
let mTgt = 0, mCur = 0;
const maxScroll = Math.max(0, MENU_LIST.length * ITEM_H - sb.clientHeight);
let wheelTimeout = null;

function snapToNearestItem() {
  const rawIndex = Math.round(-mCur / ITEM_H);
  const clampedIndex = Math.max(0, Math.min(MENU_LIST.length - 1, rawIndex));
  const targetPos = -clampedIndex * ITEM_H;
  mTgt = targetPos;
  mCur = mTgt;
  mt.style.transform = `translateY(${mCur}px)`;
  // Optionally trigger hover on that item (simulate)
  const targetLink = links[clampedIndex];
  if (targetLink && !activeLink) {
    targetLink.dispatchEvent(new Event('mouseenter'));
  }
}

function updateMenuScroll(target) {
  mTgt = target;
}

if (CONFIG.autoScroll) {
  sb.addEventListener('mousemove', e => {
    const rect = sb.getBoundingClientRect();
    const relY = (e.clientY - rect.top) / rect.height;
    updateMenuScroll(-relY * maxScroll);
  });
}

sb.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY;
  let newTarget = mTgt - delta * 0.5;
  newTarget = Math.max(-maxScroll, Math.min(0, newTarget));
  updateMenuScroll(newTarget);
  clearTimeout(wheelTimeout);
  wheelTimeout = setTimeout(snapToNearestItem, 150);
}, { passive: false });

// ── SCROLL LOOP – faster lerp for immediate feedback ────────────
(function menuRaf() {
  requestAnimationFrame(menuRaf);
  // Use a much higher lerp (0.5) so it follows wheel almost instantly
  if (Math.abs(mTgt - mCur) > 0.5) {
    mCur += (mTgt - mCur) * 0.5;   // was 0.08 – now 0.5
  } else {
    mCur = mTgt;
  }
  mt.style.transform = `translateY(${mCur}px)`;
})();

// ── HOVER: debounced to avoid flicker, timer cleared ──────────
let activeLink = null;
let hoverTimer = null;

links.forEach(lnk => {
  lnk.addEventListener('mouseenter', () => {
    // Clear any pending timer from previous hover
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    // Remove active from previous
    if (activeLink) {
      activeLink.classList.remove('is-active');
      activeLink.style.transition = '';
    }
    // Set a short delay before activating to avoid flicker on quick passes
    hoverTimer = setTimeout(() => {
      // Override transition for instant visual
      lnk.style.transition = 'none';
      activeLink = lnk;
      lnk.classList.add('is-active');
      window._TSGallery?.enter(lnk.dataset.slug);
      // Restore transition after a tiny delay
      setTimeout(() => { lnk.style.transition = ''; }, 50);
      hoverTimer = null;
    }, 50); // 150ms debounce
  });

  lnk.addEventListener('click', e => {
    e.preventDefault();
    const p = PROJECTS.find(x => x.slug === lnk.dataset.slug);
    if (p) openDetail(p);
  });
});

sb.addEventListener('mouseleave', () => {
  // Clear any pending hover timer
  if (hoverTimer) {
    clearTimeout(hoverTimer);
    hoverTimer = null;
  }
  if (activeLink) {
    activeLink.classList.remove('is-active');
    activeLink.style.transition = '';
    activeLink = null;
  }
  window._TSGallery?.leave();
});

// ── DETAIL PAGE ──────────────────────────────────────────────────
const detEl = document.getElementById('ts-portfolio-detail');
const wipeEl = document.getElementById('ts-wipe');

function openDetail(p) {
  document.getElementById('d-ol').textContent = p.type + ' · ' + p.year;
  const w = p.title.split(' ');
  document.getElementById('d-title').innerHTML = `<em>${w[0]}</em> ${w.slice(1).join(' ')}`;
  document.getElementById('d-desc').textContent = p.desc;
  document.getElementById('d-meta').innerHTML =
    [['Year', p.year], ['Type', p.type], ['Client', p.client]]
      .map(([k, v]) => `<div class="ts-dmetablock"><span class="ts-dmetalabel">${k}</span><span class="ts-dmetaval">${v}</span></div>`)
      .join('');
  document.getElementById('d-imgs').innerHTML =
    p.imgs.slice(0, 4).map(s => `<img src="${s}" alt="${p.title}" loading="lazy">`).join('');

  gsap.timeline()
    .set(wipeEl, { scaleY: 0, transformOrigin: 'bottom' })
    .to(wipeEl, { scaleY: 1, duration: 0.42, ease: 'power3.inOut' })
    .set(detEl, { transform: 'translateY(0)', opacity: 1 })
    .call(() => { 
      // 1. Pass the first image URL safely into a CSS token on the parent
      if (p.imgs && p.imgs.length > 0) {
        detEl.style.setProperty('--ts-portfolio-img-header', `url('${p.imgs[0]}')`);
      }
      // 2. Existing logic
      detEl.classList.add('open'); 
      detEl.classList.add('ts-vertical-modern'); 
      detEl.scrollTop = 0; 
    })
    .to(wipeEl, { scaleY: 0, transformOrigin: 'top', duration: 0.38, ease: 'power3.inOut' });
}

function closeDetail() {
  gsap.timeline()
    .set(wipeEl, { scaleY: 0, transformOrigin: 'bottom' })
    .to(wipeEl, { scaleY: 1, duration: 0.38, ease: 'power3.inOut' })
    .set(detEl, { transform: 'translateY(100%)' })
    .call(() => detEl.classList.remove('open'))
    .call(() => detEl.classList.remove('ts-vertical-modern'))
    .to(wipeEl, { scaleY: 0, transformOrigin: 'top', duration: 0.34, ease: 'power3.inOut' });
}

document.getElementById('ts-dback').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && detEl.classList.contains('open')) closeDetail(); });

// ── LOADER ──────────────────────────────────────────────────────
const loaderEl = document.getElementById('ts-preloader');
const fillEl = document.getElementById('ts-loader-fill');
const numEl = document.getElementById('ts-loader-num');
let dispPct = 0, realPct = 0, loaderDone = false;

(function lRaf() {
  if (loaderDone) return;
  requestAnimationFrame(lRaf);
  dispPct += (realPct - dispPct) * 0.1;
  const p = Math.min(99, Math.floor(dispPct * 100));
  fillEl.style.width = p + '%';
  numEl.textContent = p + '%';
})();

window._TSGallery.preload(
  prog => { realPct = Math.max(realPct, prog); },
  texMap => {
    realPct = 1;
    setTimeout(() => {
      window._TSGallery.init(texMap);
      fillEl.style.width = '100%';
      numEl.textContent = '100%';
      loaderDone = true;
      setTimeout(() => {
        loaderEl.classList.add('out');
        loaderEl.classList.add('is-done');
      document.documentElement.classList.remove('ts-preloader-lock');
      document.documentElement.classList.remove('ts-assets-loading');

        gsap.to('#ts-letters', { opacity: 1, y: 0, duration: 1.3, ease: 'power4.out', delay: .05 });
        gsap.to('#ts-meta-bl', { opacity: 1, y: 0, duration: .9, ease: 'power3.out', delay: .3 });
        gsap.to('#ts-meta-bc', { opacity: 1, y: 0, duration: .9, ease: 'power3.out', delay: .45 });
        revealMenu();
      }, 350);
    }, 250);
  }
);

// ── RULERS ──────────────────────────────────────────────────────
function getCSSVar(name, el = document.documentElement) {
  return getComputedStyle(el).getPropertyValue(name).trim();
}

const rsz = parseFloat(getCSSVar("--rsz")) || 1;

function createRulerSVG({ width, height, orientation = "horizontal", step = 10, majorStep = 100 }) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  const thickness = rsz;
  svg.setAttribute("class", `ts-grid-rules__${orientation}`);
  svg.setAttribute("width", orientation === "horizontal" ? width : thickness);
  svg.setAttribute("height", orientation === "horizontal" ? thickness : height);
  svg.setAttribute("viewBox", orientation === "horizontal" ? `0 0 ${width} ${thickness}` : `0 0 ${thickness} ${height}`);
  const max = orientation === "horizontal" ? width : height;
  for (let i = 0; i <= max; i += step) {
    const isMajor = i % majorStep === 0;
    const isMid = i % 50 === 0;
    const line = document.createElementNS(ns, "line");
    if (orientation === "horizontal") {
      line.setAttribute("x1", i);
      line.setAttribute("x2", i);
      line.setAttribute("y1", 0);
      line.setAttribute("y2", isMajor ? 10 : isMid ? 7 : 5);
    } else {
      line.setAttribute("y1", i);
      line.setAttribute("y2", i);
      line.setAttribute("x1", 0);
      line.setAttribute("x2", isMajor ? 10 : isMid ? 7 : 5);
    }
    line.setAttribute("class", "ts-grid-rules-line");
    if (!isMajor) line.setAttribute("opacity", "0.5");
    svg.appendChild(line);
    if (isMajor && i !== 0) {
      const text = document.createElementNS(ns, "text");
      if (orientation === "horizontal") {
        text.setAttribute("x", i);
        text.setAttribute("y", 18);
      } else {
        text.setAttribute("x", 18);
        text.setAttribute("y", i + 4);
        text.setAttribute("transform", `rotate(-90 14 ${i})`);
      }
      text.setAttribute("class", "ts-grid-rules-text");
      text.textContent = i;
      svg.appendChild(text);
    }
  }
  return svg;
}

function mountRulers(container) {
  const wrapper = document.createElement("div");
  wrapper.className = "ts-grid-rules";
  function render() {
    wrapper.innerHTML = "";
    const rect = container.getBoundingClientRect();
    const horizontal = createRulerSVG({ width: Math.round(rect.width), height: 18, orientation: "horizontal" });
    const vertical = createRulerSVG({ width: 18, height: Math.round(rect.height), orientation: "vertical" });
    wrapper.appendChild(horizontal);
    wrapper.appendChild(vertical);
  }
  render();
  const ro = new ResizeObserver(render);
  ro.observe(container);
  container.appendChild(wrapper);
}

document.addEventListener("DOMContentLoaded", () => {
  const container = document.querySelector("#ts-app");
  if (!container) {
    console.warn("Ruler init failed: container not found");
    return;
  }
  mountRulers(container);
  document.getElementById('ts-dims').textContent = `${window.innerWidth}px × ${window.innerHeight}px`;
});
</script>

  <script>
  // 1. Only run if hosted on HTTPS (ignores local file:// or http:// localhost)
  if (window.location.protocol === 'https:') {
    
    // Generate a progressive/unique number based on the current timestamp
    const uniqueNum = Date.now(); 
    let elementCounter = 0;

    // 2. Target all CSS links and JS scripts
    const elements = document.querySelectorAll('link[rel="stylesheet"], script[src]');

    elements.forEach((el) => {
      // Get the current source attribute
      const attrName = el.tagName === 'LINK' ? 'href' : 'src';
      const originalPath = el.getAttribute(attrName);

      if (originalPath) {
        // 3. Match any path containing "assets/" followed by a subfolder
        const assetsRegex = /assets\/[^\/]+\//;

        if (assetsRegex.test(originalPath)) {
          // Increment counter so each file gets a completely different progressive number
          elementCounter++; 
          const separator = originalPath.includes('?') ? '&' : '?';
          
          // Append the unique progressive version string
          const newPath = `${originalPath}${separator}v=${uniqueNum}-${elementCounter}`;
          el.setAttribute(attrName, newPath);
        }
      }
    });
  }
</script>

<!-- ================================================================
     TOOLSKIN LAYOUT STUDIO — JS ENGINE v3
     ================================================================
     SSOT Contracts (§2):
       updateGrid(N)   → sole entry for column changes
       updateGap(px)   → sole entry for gap changes
       updatePad(px)   → sole entry for padding changes
       updateMinH(px)  → sole entry for min-height changes
       computeGridVars → reads actual px from bento DOM, writes :root tokens

     Grid Overlay (§3b):
       renderOverlayCols() → creates N .ts-grid-overlay__col children
       Overlay CSS Grid has same template as .ts-bento — zero drift

     No inline styles rule (§9):
       JS never sets element.style.* — only CSS custom properties on :root
       and data-* / class attributes on elements

     Nesting guard (§9):
       getSelectedTile() returns null at depth ≥ 3
================================================================ -->
<script>

  /* ── SSOT: computeGridVars (§2, B05) ────────────────────────
     Reads ACTUAL rendered px from the bento element's computed style.
     NOT from getPropertyValue on var() strings (those return raw tokens).
  ─────────────────────────────────────────────────────────────── */
  function computeGridVars() {
    var bento = getPrimaryBento();
    if (!bento) return;
    var cs   = getComputedStyle(bento);
    var pad  = parseFloat(cs.paddingLeft)  || 0;
    var gap  = parseFloat(cs.columnGap)    || 0;
    var W    = bento.clientWidth;
    var N    = currentCols;
    var inner = W - 2 * pad;
    var colW  = inner > 0 ? (inner - (N - 1) * gap) / N : 0;
    var tileW = colW + gap;
    root.style.setProperty('--ts-col-width',  Math.max(0, colW)  + 'px');
    root.style.setProperty('--ts-tile-width', Math.max(0, tileW) + 'px');
    /* Update canvas size badge */
    var canvas = document.getElementById('ts-canvas-container');
    if (canvas && canvasSizeBadge) {
      canvasSizeBadge.textContent =
        Math.round(canvas.clientWidth) + 'px × ' + Math.round(canvas.clientHeight) + 'px';
    }
    /* Update overlay grid after resize */
    renderOverlayCols();
  }

  function updateGrid(cols) {

    updateExport();

  /* ── SSOT: updateGap (§2) ──────────────────────────────── */
  function updateGap(px) {

  /* ── EXPORT SYSTEM (§11) ────────────────────────────────── */
  var STRIP_CLASSES = [
    'ts-layout-container','ts-live-preview','ts-tile--selected',
    'ts-nested-block','ts-nested-card'
  ];
  var STRIP_ATTRS = ['data-level','data-visible','data-gap-mode'];

  function getCleanHTML() {
    var clone = masterLayout.cloneNode(true);
    /* Remove overlay */
    var ol = clone.querySelector('#ts-grid-overlay');
    if (ol) ol.remove();
    /* Remove inner topbar status */
    var tb = clone.querySelector('.ts-app__topbar');
    if (tb) { var st = tb.querySelector('#ts-grid-status'); if(st) tb.removeChild(st); }
    /* B-fix-2: strip the clone root itself (querySelectorAll excludes the root element) */
    STRIP_CLASSES.forEach(function (c) { clone.classList.remove(c); });
    STRIP_ATTRS.forEach(function (a)   { clone.removeAttribute(a); });
    clone.removeAttribute('style');
    if (clone.className === '') clone.removeAttribute('class');
    /* Strip editor artifacts from all descendants */
    clone.querySelectorAll('*').forEach(function (el) {
      STRIP_CLASSES.forEach(function (c) { el.classList.remove(c); });
      STRIP_ATTRS.forEach(function (a)   { el.removeAttribute(a); });
      el.removeAttribute('style'); /* no inline styles ever */
      if (el.className === '') el.removeAttribute('class');
    });
    var html = (new XMLSerializer()).serializeToString(clone);
    html = html.replace(/ xmlns="[^"]*"/g, '');
    return prettyHTML(html);
  }

  function prettyHTML(html) {
    var VOID = 'area base br col embed hr img input link meta param source track wbr'.split(' ');
    var P = '  '; var d = 0; var out = '';
    var parts = html.split(/(<[^>]+>)/);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i]; if (!p) continue;
      if (p[0] === '<' && p[1] === '!') {
        out += '\n' + P.repeat(d) + p;
      } else if (p[0] === '<' && p[1] === '/') {
        d = Math.max(0, d - 1); out += '\n' + P.repeat(d) + p;
      } else if (p[0] === '<') {
        var name = ((p.match(/<([a-zA-Z][\w-]*)/) || [])[1] || '').toLowerCase();
        out += '\n' + P.repeat(d) + p;
        if (name && VOID.indexOf(name) < 0 && !/\/>$/.test(p)) d++;
      } else {
        var t = p.trim(); if (t) out += '\n' + P.repeat(d) + t;
      }
    }
    return out.trim();
  }

  function updateExport() {
    try {
      if (exportArea) exportArea.value = getCleanHTML();
    } catch (e) {
      if (exportArea) exportArea.value = '<!-- export error: ' + e.message + ' -->';
    }
  }

  }

  function initTabs() {

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t)  { t.classList.remove('active'); });
        panes.forEach(function (p) { p.classList.remove('active'); p.style.display = 'none'; });
        tab.classList.add('active');
        var pane = document.querySelector('[data-pane="' + tab.dataset.tab + '"]');
        if (pane) {
          pane.classList.add('active');
          pane.style.display = tab.dataset.tab === 'code' ? 'flex' : 'block';
          if (tab.dataset.tab === 'code') pane.style.flexDirection = 'column';
          if (tab.dataset.tab === 'code') pane.style.height = '100%';
        }
      });
    });
  }

  /* ── ACCORDION ──────────────────────────────────────────── */
  function initAccordion() {
    document.querySelectorAll('.ts-card-header.ts-accordion').forEach(function (hdr) {
      hdr.addEventListener('click', function () { hdr.classList.toggle('open'); });
    });
    /* Open first card in each pane by default */
    document.querySelectorAll('.ts-tab-pane').forEach(function (pane) {
      var first = pane.querySelector('.ts-card-header.ts-accordion');
      if (first) first.classList.add('open');
    });
  }

 /* ── GRID ENGINE — SSOT ────────────────────────────────────
       [F9] reads paddingLeft + columnGap from the actual rendered bento
       element — NOT getPropertyValue() which returns raw "var(...)" strings
       that parseFloat turns into NaN.
    ──────────────────────────────────────────────────────────── */
    function computeGridVars() {
      var main  = getAppMain();
      var bento = getPrimaryBento() || (main && main.querySelector('.ts-bento'));
      if (!main || !bento) return;

      var cs  = getComputedStyle(bento);
      var pad = parseFloat(cs.paddingLeft)  || 0;   /* actual rendered px */
      var gap = parseFloat(cs.columnGap)    || 0;   /* actual rendered px */
      var N   = currentCols;
      var W   = main.clientWidth;
      var inner = W - 2 * pad;
      var colW  = inner > 0 ? (inner - (N - 1) * gap) / N : 0;
      var tileW = colW + gap;

      root.style.setProperty('--ts-col-width',  Math.max(0, colW)  + 'px');
      root.style.setProperty('--ts-tile-width', Math.max(0, tileW) + 'px');
      /* Expose resolved bento-pad as px so .ts-grid-overlay margin resolves */
      root.style.setProperty('--ts-bento-pad', pad + 'px');
    }

    /* updateGrid: ONLY entry point for column count changes */
    function updateGrid(cols) {
      currentCols = cols;
      root.style.setProperty('--ts-layout-cols', cols);
      root.setAttribute('data-ts-cols', String(cols));
      requestAnimationFrame(function() { computeGridVars(); refreshStatus(); updateExport(); });
    }

    /* updateGap: ONLY entry point for gap changes */
    function updateGap(px) {
      currentGap = px;
      root.style.setProperty('--ts-grid-gap', px + 'px');
      //if (gapValEl) gapValEl.textContent = px + 'px';
      if (gapVal) gapVal.textContent = px + 'px';
      requestAnimationFrame(function() { computeGridVars(); updateExport(); });
    }
  /* ── OBSERVERS ──────────────────────────────────────────── */
  var MO_OPTS = { childList: true, subtree: true, attributes: true };

  /* ── EVENT WIRING ───────────────────────────────────────── */
  function wireEvents() {
    /* Scaffold picker */
    if (scaffoldSelect) {
      scaffoldSelect.addEventListener('change', function (e) { loadScaffold(e.target.value); });
    }
    /* Reset */
    if (resetBtn) {
      resetBtn.addEventListener('click', function () { loadScaffold(currentScaffold); });
    }
    /* Reset */
    if (resetBtn2) {
      resetBtn2.addEventListener('click', function () { loadScaffold(currentScaffold); });
    }
    /* Overlay toggle */
    if (overlayToggle) {
      overlayToggle.addEventListener('change', function (e) { setOverlay(e.target.checked); });
    }
    /* Overlay toggle */
    if (overlayToggle2) {
      overlayToggle2.addEventListener('change', function (e) { setOverlay(e.target.checked); });
    }
    /* Gap slider */
    if (gapRange) {
      gapRange.addEventListener('input', function (e) {
        var v = parseInt(e.target.value);
        if (gapVal) gapVal.textContent = v + 'px';
        updateGap(v);
      });
    }
    /* Gap slider */
    if (gapSlider) {
      gapSlider.addEventListener('input', function(e) { updateGap(parseInt(e.target.value, 10)); });
    }

    /* Pad slider */
    if (padRange) {
      padRange.addEventListener('input', function (e) {
        var v = parseInt(e.target.value);
        if (padVal) padVal.textContent = v + 'px';
        updatePad(v);
      });
    }
    /* Min height slider */
    if (minhRange) {
      minhRange.addEventListener('input', function (e) {
        var v = parseInt(e.target.value);
        if (minhVal) minhVal.textContent = v + 'px';
        updateMinH(v);
      });
    }
    /* Column chips */
    document.getElementById('ts-col-chips').addEventListener('click', function (e) {
      var btn = e.target.closest('.ts-chip[data-cols]');
      if (!btn) return;
      updateGrid(parseInt(btn.dataset.cols));
    });
    /* Span chips */
    document.getElementById('ts-span-chips').addEventListener('click', function (e) {
      var btn = e.target.closest('.ts-chip[data-span]');
      if (!btn) return;
      setSpan(btn.dataset.span);
    });
    /* Layout chips */
    document.getElementById('ts-layout-chips').addEventListener('click', function (e) {
      var btn = e.target.closest('.ts-chip[data-layout]');
      if (!btn) return;
      setInnerLayout(btn.dataset.layout);
    });
    /* Nest buttons */
    if (nestGridBtn)  nestGridBtn.addEventListener('click',  nestGrid);
    if (nestSplitBtn) nestSplitBtn.addEventListener('click', nestSplit);
     if (nestGridBtn2)  nestGridBtn2.addEventListener('click',  nestGrid);
    if (nestSplitBtn2) nestSplitBtn2.addEventListener('click', nestSplit);
    /* Copy buttons */
    if (copyBtn)       copyBtn.addEventListener('click',       function () { doCopy(copyBtn); });
    if (copyHeaderBtn) copyHeaderBtn.addEventListener('click', function () { doCopy(copyHeaderBtn); });
    /* Tile selection — click delegation */
    masterLayout.addEventListener('click', function (e) {
      var tile = e.target.closest('.ts-layout-container[data-level]');
      if (!tile || !masterLayout.contains(tile)) return;
      var lvl = parseInt(tile.getAttribute('data-level'), 10);
      if (lvl > 0) { e.stopPropagation(); selectTile(tile); }
    });
  }


    /* ── STATUS BAR ──────────────────────────────────────────── */
    function refreshStatus() {
      var lvl = selectedTile ? selectedTile.getAttribute('data-level') : null;
      var atMax = lvl && parseInt(lvl, 10) >= 3;
      if (gridStatus) {
        gridStatus.textContent = currentCols + ' cols · ' +
          (lvl
            ? (atMax ? 'L' + lvl + ' — max depth reached' : 'L' + lvl + ' selected — click ＋ to nest')
            : 'click a tile to select');
      }
      if (selStatus) {
        selStatus.textContent = lvl ? 'L' + lvl + (atMax ? ' (max)' : ' active') : 'no selection';
      }
    }
  /* ── INIT ───────────────────────────────────────────────── */
  function init() {
    /* Setup tabs and accordion first */
    initTabs();
    initAccordion();
    /* Initial tile panel state */
    if (tileSection)     tileSection.style.display = 'none';
    if (tilePlaceholder) tilePlaceholder.style.display = '';
    /* Wire all events */
    wireEvents();
    /* ResizeObserver for col-width recompute */
    if (typeof ResizeObserver !== 'undefined') {
      ro = new ResizeObserver(function () { computeGridVars(); });
    } else {
      window.addEventListener('resize', computeGridVars, { passive: true });
    }
    /* MutationObserver for live export updates */
    mo = new MutationObserver(function () { updateExport(); });
    /* Load default scaffold */
    loadScaffold('app-shell');

     var main = getAppMain();
      if (ro && main) ro.observe(main);
      updateGrid(12);
      updateGap(0);
      setOverlay(false);
      requestAnimationFrame(function() { computeGridVars(); updateExport(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

}());
</script>

  <script>
    window.ASSET_VERSION = "4.2.1";

    (function() {
      const version = window.ASSET_VERSION;
      
      // Core function to rewrite paths immediately
      function patchElement(el) {
        const attr = el.tagName === 'LINK' ? 'href' : 'src';
        const originalPath = el.getAttribute(attr);
        
        if (originalPath && originalPath.includes('assets/') && !originalPath.includes(`v=${version}`)) {
          const cleanPath = originalPath.split('?')[0];
          el.setAttribute(attr, `${cleanPath}?v=${version}`);
        }
      }

      // 1. Intercept elements as they stream into the HTML document (Prevents FOUC/Double-fetch)
      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (node.nodeType === 1) { // Check if it's an element
              if ((node.tagName === 'LINK' && node.hasAttribute('href')) || 
                  (node.tagName === 'SCRIPT' && node.hasAttribute('src'))) {
                patchElement(node);
              }
              // Catch nested items if necessary
              if (node.userId === undefined) {
                const childs = node.querySelectorAll('link[href], script[src]');
                childs.forEach(patchElement);
              }
            }
          }
        }
      });

      observer.observe(document.documentElement, { childList: true, subtree: true });

      // 2. Disconnect safely once the document is interactive
      document.addEventListener('readystatechange', () => {
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
          observer.disconnect();
        }
      });
    })();
  </script>

  <!-- ================================================================
     TOOLSKIN LAYOUT STUDIO — JS ENGINE v3
     ================================================================
     SSOT Contracts (§2):
       updateGrid(N)   → sole entry for column changes
       updateGap(px)   → sole entry for gap changes
       updatePad(px)   → sole entry for padding changes
       updateMinH(px)  → sole entry for min-height changes
       computeGridVars → reads actual px from bento DOM, writes :root tokens

     Grid Overlay (§3b):
       renderOverlayCols() → creates N .ts-grid-overlay__col children
       Overlay CSS Grid has same template as .ts-bento — zero drift

     No inline styles rule (§9):
       JS never sets element.style.* — only CSS custom properties on :root
       and data-* / class attributes on elements

     Nesting guard (§9):
       getSelectedTile() returns null at depth ≥ 3
  ================================================================ -->
  <script>
  (function () {
    'use strict';

    /* ── STATE ─────────────────────────────────────────────── */
    var currentCols    = 12;
    var currentGap     = 0;
    var currentPad     = 24;
    var currentMinH    = 160;
    var overlayActive  = false;
    var selectedTile   = null;
    var currentScaffold = 'app-shell';
    var ro, mo;

    /* ── DOM REFS ───────────────────────────────────────────── */
    var root           = document.documentElement;
    var masterLayout   = document.getElementById('ts-master-layout');
    var canvasSizeBadge= document.getElementById('ts-canvas-size-badge');
    var scaffoldSelect = document.getElementById('ts-scaffold-select');
    var resetBtn       = document.getElementById('ts-reset-btn');
    var overlayToggle  = document.getElementById('ts-overlay-toggle');
    var overlayToggleBtn  = document.getElementById('ts-overlay-toggle-btn');
    var gapRange       = document.getElementById('ts-gap-range');
    var gapVal         = document.getElementById('ts-gap-val');
    var padRange       = document.getElementById('ts-pad-range');
    var padVal         = document.getElementById('ts-pad-val');
    var minhRange      = document.getElementById('ts-minh-range');
    var minhVal        = document.getElementById('ts-minh-val');
    var exportArea     = document.getElementById('ts-export-textarea');
    var copyBtn        = document.getElementById('ts-copy-export-btn');
    var copyHeaderBtn  = document.getElementById('ts-copy-header-btn');
    var nestGridBtn    = document.getElementById('ts-nest-grid-btn');
    var nestSplitBtn   = document.getElementById('ts-nest-split-btn');
    var tileLevelBadge = document.getElementById('ts-tile-level-badge');
    var tileSection    = document.getElementById('ts-tile-section');
    var tilePlaceholder= document.getElementById('ts-tile-placeholder');

    /* Live refs (inside scaffold — must be fetched after scaffold change) */
    function getOverlay() { return document.getElementById('ts-grid-overlay'); }
    function getPrimaryBento() { return document.getElementById('ts-primary-bento'); }
    function getAppMain()   { return document.getElementById('ts-app-main'); }

    /* ── SSOT: computeGridVars (§2, B05) ────────────────────────
       Reads ACTUAL rendered px from the bento element's computed style.
       NOT from getPropertyValue on var() strings (those return raw tokens).
    ─────────────────────────────────────────────────────────────── */
    function computeGridVars() {
      var bento = getPrimaryBento();
      if (!bento) return;
      var cs   = getComputedStyle(bento);
      var pad  = parseFloat(cs.paddingLeft)  || 0;
      var gap  = parseFloat(cs.columnGap)    || 0;
      var W    = bento.clientWidth;
      var N    = currentCols;
      var inner = W - 2 * pad;
      var colW  = inner > 0 ? (inner - (N - 1) * gap) / N : 0;
      var tileW = colW + gap;
      root.style.setProperty('--ts-col-width',  Math.max(0, colW)  + 'px');
      root.style.setProperty('--ts-tile-width', Math.max(0, tileW) + 'px');
      /* Update canvas size badge */
      var canvas = document.getElementById('ts-canvas-container');
      if (canvas && canvasSizeBadge) {
        canvasSizeBadge.textContent =
          Math.round(canvas.clientWidth) + 'px × ' + Math.round(canvas.clientHeight) + 'px';
      }
      /* Update overlay grid after resize */
      renderOverlayCols();
    }

    /* ── SSOT: updateGrid (§2) ─────────────────────────────── */
    function updateGrid(cols) {
      currentCols = cols;
      root.style.setProperty('--ts-layout-cols', cols);
      root.setAttribute('data-ts-cols', String(cols));
      /* Sync column chip active state */
      document.querySelectorAll('#ts-col-chips .ts-chip-btn').forEach(function (b) {
        b.classList.toggle('active', parseInt(b.dataset.cols) === cols);
      });
      renderOverlayCols();
      computeGridVars();
      updateExport();
    }

    /* ── SSOT: updateGap (§2) ──────────────────────────────── */
    function updateGap(px) {
      currentGap = px;
      root.style.setProperty('--ts-grid-gap', px + 'px');
      /* §10: set gap mode on bento */
      var bento = getPrimaryBento();
      if (bento) {
        var mode = px === 0 ? 'wireframe' : px < 24 ? 'card' : 'spaced';
        bento.setAttribute('data-gap-mode', mode);
      }
      /* §3-fix: gap and pad are independently controlled — no cross-mutation */
      computeGridVars();
      updateExport();
    }

    /* ── SSOT: updatePad (§2) ──────────────────────────────── */
    function updatePad(px) {
      currentPad = px;
      root.style.setProperty('--ts-bento-pad', px + 'px');
      computeGridVars();
      updateExport();
    }

    /* ── SSOT: updateMinH (§2) ─────────────────────────────── */
    function updateMinH(px) {
      currentMinH = px;
      root.style.setProperty('--ts-bento-min-h', px + 'px');
      updateExport();
    }

    /* ── GRID OVERLAY (§3b) — CSS Grid cells ───────────────────
       Creates N .ts-grid-overlay__col children inside the overlay element.
       The overlay has the identical grid-template-columns as .ts-bento.
       Browser grid engine ensures zero drift.
    ─────────────────────────────────────────────────────────────── */
    function renderOverlayCols() {
      var ol = getOverlay();
      if (!ol) return;
      /* Only rebuild if count changed */
      if (ol.children.length === currentCols) return;
      ol.innerHTML = '';
      for (var i = 0; i < currentCols; i++) {
        var col = document.createElement('div');
        col.className = 'ts-grid-overlay__col';
        ol.appendChild(col);
      }
    }

      /* ── OVERLAY TOGGLE ────────────────────────────────────── */
      function setOverlay(active) {
        overlayActive = active;
        var ol = getOverlay();
        if (ol) ol.setAttribute('data-visible', active ? 'true' : 'false');
        if (overlayToggle) overlayToggle.checked = active;
        renderOverlayCols();
      }

      /* ── STATUS ─────────────────────────────────────────────── */
      function refreshTilePanel() {
        var hasSelection = selectedTile && masterLayout.contains(selectedTile);
        if (tileSection) {
          tileSection.classList.toggle('active', hasSelection);
          tileSection.style.display = hasSelection ? '' : 'none';

          if (hasSelection) {
            var header = tileSection.querySelector('.ts-card-header.ts-accordion');
            if (header) header.classList.add('open');
          }
        }
        if (tilePlaceholder) {
          tilePlaceholder.style.display = hasSelection ? 'none' : '';
        }
        if (!hasSelection) {
          document.querySelectorAll('#ts-span-chips .ts-chip-btn, #ts-layout-chips .ts-chip-btn').forEach(function (b) {
            b.classList.remove('active');
          });
          if (tileLevelBadge) tileLevelBadge.textContent = '';
          updateInnerTopbar('');
          return;
        }
        var lvl = parseInt(selectedTile.getAttribute('data-level') || '0', 10);
        var atMax = lvl >= 3;
        if (tileLevelBadge) tileLevelBadge.textContent = 'L' + lvl + (atMax ? ' MAX' : '');
        if (nestGridBtn)  nestGridBtn.disabled  = atMax;
        if (nestSplitBtn) nestSplitBtn.disabled = atMax;

        // Replace your old manual lines with these cleanly managed alias lookups:
        setGroupState('ts-nest-grid-btn', 'disabled', atMax);
        setGroupState('ts-nest-split-btn', 'disabled', atMax);

        // Example: To highlight all alias instances of the active panel state synchronously
        setGroupState('ts-nest-grid-btn', 'class', true); 
        setGroupState('ts-nest-split-btn', 'class', true); 
        /* Reflect active span class */
        var SPANS = ['ts-bento__hero','ts-bento__half','ts-bento__third','ts-bento__quart','ts-bento__wide','ts-bento__full'];
        document.querySelectorAll('#ts-span-chips .ts-chip-btn').forEach(function (b) {
          b.classList.toggle('active', selectedTile.classList.contains(b.dataset.span));
        });
        /* Reflect inner layout class */
        var inner = selectedTile.querySelector(':scope > .ts-stack, :scope > .ts-split, :scope > .ts-grid');
        document.querySelectorAll('#ts-layout-chips .ts-chip-btn').forEach(function (b) {
          b.classList.toggle('active', inner && inner.classList.contains(b.dataset.layout));
        });
        updateInnerTopbar(currentCols + ' cols · L' + lvl + (atMax ? ' — max depth' : ' selected'));

      function updateInnerTopbar(text) {
        var el = document.getElementById('ts-grid-status');

      /* ── TILE SELECTION (§9) ───────────────────────────────── */
      function selectTile(el) {
        masterLayout.querySelectorAll('.ts-tile--selected').forEach(function (e) {
          e.classList.remove('ts-tile--selected');
        });
        selectedTile = el || null;
        if (el) el.classList.add('ts-tile--selected');
        refreshTilePanel();
      }

      /* Returns target tile for nesting, or null if at max depth */
      function getSelectedTile() {
        if (selectedTile && masterLayout.contains(selectedTile)) {
          var lvl = parseInt(selectedTile.getAttribute('data-level') || '0', 10);
          if (lvl >= 3) return null;
          if (lvl > 0)  return selectedTile;
        }
        return masterLayout.querySelector('.ts-layout-container[data-level="1"]') || null;
      }

      /* ── SPAN SWITCHER ─────────────────────────────────────── */
      var SPAN_CLASSES = ['ts-bento__hero','ts-bento__half','ts-bento__third','ts-bento__quart','ts-bento__wide','ts-bento__full'];
      function setSpan(spanClass) {
        if (!selectedTile) return;
        SPAN_CLASSES.forEach(function (c) { selectedTile.classList.remove(c); });
        selectedTile.classList.add(spanClass);
        refreshTilePanel();

      }

      /* ── LAYOUT SWITCHER ───────────────────────────────────── */
      function setInnerLayout(layoutClass) {
        if (!selectedTile) return;
        /* Find or create the inner layout container */
        var inner = selectedTile.querySelector(':scope > .ts-stack, :scope > .ts-split, :scope > .ts-grid');
        if (!inner) {
          /* If tile has direct children (nested blocks), wrap them */
          inner = document.createElement('div');
          inner.className = layoutClass + ' ts-nested-block ts-layout-container';
          inner.setAttribute('data-level', selectedTile.getAttribute('data-level'));

          selectedTile.appendChild(inner);
        } else {

var STRIP_CLASSES = [
  'ts-layout-container','ts-layout-tag','ts-layout-tag','ts-live-preview','ts-tile--selected',
  'ts-nested-block','ts-nested-card'
];

var STRIP_ATTRS = ['data-level','data-visible','data-gap-mode'];

/* ── CLEAN HTML EXPORT ─────────────────────────────────── */

function getCleanHTML() {
  var clone = masterLayout.cloneNode(true);

  var ol = clone.querySelector('#ts-grid-overlay');
  if (ol) ol.remove();

  var tb = clone.querySelector('.ts-app__topbar');
  if (tb) {
    var st = tb.querySelector('#ts-grid-status');
    if (st) tb.removeChild(st);
  }

  STRIP_CLASSES.forEach(function (c) { clone.classList.remove(c); });
  STRIP_ATTRS.forEach(function (a) { clone.removeAttribute(a); });
  clone.removeAttribute('style');
  if (clone.className === '') clone.removeAttribute('class');

  clone.querySelectorAll('*').forEach(function (el) {
    STRIP_CLASSES.forEach(function (c) { el.classList.remove(c); });
    STRIP_ATTRS.forEach(function (a) { el.removeAttribute(a); });
    el.removeAttribute('style');
    if (el.className === '') el.removeAttribute('class');
  });

  var html = (new XMLSerializer()).serializeToString(clone);
  html = html.replace(/ xmlns="[^"]*"/g, '');

  return prettyHTML(html);
}

/* ── PRETTY FORMAT ─────────────────────────────────────── */

function prettyHTML(html) {
  var VOID = 'area base br col embed hr img input link meta param source track wbr'.split(' ');
  var P = '  ';
  var d = 0;
  var out = '';

  var parts = html.split(/(<[^>]+>)/);

  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (!p) continue;

    if (p[0] === '<' && p[1] === '!') {
      out += '\n' + P.repeat(d) + p;
    } else if (p[0] === '<' && p[1] === '/') {
      d = Math.max(0, d - 1);
      out += '\n' + P.repeat(d) + p;
    } else if (p[0] === '<') {
      var name = ((p.match(/<([a-zA-Z][\w-]*)/) || [])[1] || '').toLowerCase();
      out += '\n' + P.repeat(d) + p;
      if (name && VOID.indexOf(name) < 0 && !/\/>$/.test(p)) d++;
    } else {
      var t = p.trim();
      if (t) out += '\n' + P.repeat(d) + t;
    }
  }

  return out.trim();
}

/* ── EXPORT UPDATE ─────────────────────────────────────── */

function updateExport() {
  try {
    if (exportArea) {
      var html = getCleanHTML();
      exportArea.value = html;
      update(html); // 🔥 sync Prism view
    }
  } catch (e) {
    if (exportArea) {
      exportArea.value = '<!-- export error: ' + e.message + ' -->';
    }
  }
}

/* ── SAFE HTML ESCAPE ─────────────────────────────────── */

function escapeHTML(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* ── CODE MIRROR + PRISM ──────────────────────────────── */

var textarea = document.querySelector("#ts-export-textarea");
var preEl = document.querySelector("#highlighting");

/* Ensure <pre><code> structure ALWAYS valid */
function ensureCodeStructure() {
  var pre = document.querySelector("#highlighting");
  if (!pre) return null;

  var code = pre.querySelector("code");

  if (!code) {
    code = document.createElement("code");
    code.id = "highlighting-content";
    code.className = "language-markup";
    pre.innerHTML = "";
    pre.appendChild(code);
  }

  return code;
}

/* Core update (FIXED) */
function update(text) {
  var codeEl = ensureCodeStructure();
  if (!codeEl) return;

  if (text.endsWith("\n")) text += " ";

  /* CRITICAL: use textContent, NOT innerHTML */
  codeEl.textContent = text;

  /* Force Prism re-highlight */
  Prism.highlightElement(codeEl);
}

/* ── BIND TEXTAREA → CODE VIEW ───────────────────────── */

if (textarea) {
  textarea.addEventListener("input", function () {
    update(textarea.value);
  });

  /* Initial sync */
  update(textarea.value);
}

/* ── SYNC SCROLL (CRITICAL FOR OVERLAY MODEL) ─────────── */

function syncScroll() {
  if (!textarea || !preEl) return;

  preEl.scrollTop = textarea.scrollTop;
  preEl.scrollLeft = textarea.scrollLeft;
}

/* ── MAIN LOOP (DIRECT MIRROR, NO EXTRA TRIGGERS) ─────── */

if (textarea) {

  let rafId;

  textarea.addEventListener("input", function () {
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function () {
      update(textarea.value);
    });
  });

  textarea.addEventListener("scroll", syncScroll);

  /* initial render */
  update(textarea.value || "");
}

  });
}

      /* ── EVENT WIRING ───────────────────────────────────────── */
     function wireEvents() {
      // 1. Loop through your core declarative event mapping array
      EVENT_REGISTRY.forEach(config => {
        const instances = getElementAndAliases(config.id);
        
        instances.forEach(el => {
          el.removeEventListener(config.type, el.__tsHandler__);
          const handler = function(e) {
               // Clear active class from parent elements within this functional group first 
            // to prevent getting stuck
            instances.forEach(i => {
              const parent = i.parentElement;
              if (parent) parent.classList.remove('active');
            });
            config.handler(e, instances);
          };

          el.__tsHandler__ = handler;
          el.addEventListener(config.type, handler);

      const spanChips = document.getElementById('ts-span-chips');

          if (!tile || !masterLayout.contains(tile)) return;

      /* ── CENTRALIZED EVENT CONFIGURATION ─────────────────────── */
    // Define all interactions in a single, reusable data structure.
    // 'id' is the primary base ID. The engine automatically finds '-2', '-3', etc.
    const EVENT_REGISTRY = [
      { id: 'ts-scaffold-select', type: 'change', handler: (e) => loadScaffold(e.target.value) },
      { id: 'ts-reset-btn',       type: 'click',  handler: () => loadScaffold(currentScaffold) },

      { id: 'ts-nest-grid-btn',   type: 'click',  handler: nestGrid },
      { id: 'ts-nest-split-btn',  type: 'click',  handler: nestSplit },
      { id: 'ts-copy-export-btn', type: 'click',  handler: function(e) { doCopy(e.currentTarget); } },
      { id: 'ts-copy-header-btn', type: 'click',  handler: function(e) { doCopy(e.currentTarget); } },
      {
        id: 'ts-gap-range',
        type: 'input',
        handler: (e, instances) => {
          const v = parseInt(e.target.value);
          const gapVal = document.getElementById('ts-gap-val');
          if (gapVal) gapVal.textContent = v + 'px';
          // Sync slider values across all layout duplicates if they exist
          instances.forEach(el => { if(el !== e.target) el.value = v; });
          updateGap(v);
        }
      },
      {
        id: 'ts-pad-range',
        type: 'input',
        handler: (e, instances) => {
          const v = parseInt(e.target.value);
          const padVal = document.getElementById('ts-pad-val');
          if (padVal) padVal.textContent = v + 'px';
          instances.forEach(el => { if(el !== e.target) el.value = v; });
          updatePad(v);
        }
      },
      {
        id: 'ts-minh-range',
        type: 'input',
        handler: (e, instances) => {
          const v = parseInt(e.target.value);
          const minhVal = document.getElementById('ts-minh-val');
          if (minhVal) minhVal.textContent = v + 'px';
          instances.forEach(el => { if(el !== e.target) el.value = v; });
          updateMinH(v);
        }
      }
    ];

    // Helper to find an element and all of its numbered structural aliases
    /*function getElementAndAliases(baseId) {
      const instances = [];
      // Look for baseId, baseId-2, baseId-3, etc.

      while (true) {
        const el = document.getElementById(`${baseId}${suffix}`);
        if (!el) break;
        instances.push(el);

        suffix = `-${counter}`;
      }
      return instances;

    function getElementAndAliases(baseId) {
      return Array.from(document.querySelectorAll(`[id^="${baseId}"]`));
    }
    /* ── REUSABLE STATE MANAGER ────────────────────────────── */
    // Use this single utility function everywhere in your app to change states 
    // (like disabled, active classes) across primary elements and all variants at once.
    function setGroupState(baseId, stateType, value) {
      const elements = getElementAndAliases(baseId);
      elements.forEach(el => {
        if (stateType === 'disabled') {
          el.disabled = value;
        } else if (stateType === 'class') {
          // Safely toggle active state on elements or their parent component container
          const target = el.parentElement || el; 
          if (value) {
            target.classList.add('active');
          } else {
            target.classList.remove('active');
          }
        }
      });
    }
